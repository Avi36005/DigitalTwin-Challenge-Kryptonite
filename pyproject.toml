[project]
name = "glucotwin"
version = "0.1.0"
description = "GlucoTwin: research proof of concept for personalized Type 2 diabetes glucose forecasting (Digital Twin Challenge 2026)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "catboost>=1.2.7",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[project.optional-dependencies]
# Optional research track (Prompt 03 §7). Never required for the CPU demo.
chronos = [
    "chronos-forecasting",
    "torch",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]
docs = [
    "python-pptx>=1.0",
    "matplotlib>=3.9",
    "reportlab>=4.2",
]

[project.scripts]
glucotwin = "glucotwin.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml/glucotwin", "services/api/glucotwin_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
